version: 2
updates:
  - package-ecosystem: npm
    # Univer's facade plugins extend one shared core; mixed versions break
    # both TypeScript augmentation and runtime registration.
    groups:
      univer:
        applies-to: version-updates
        patterns:
          - "@univerjs/*"
      univer-security:
        applies-to: security-updates
        patterns:
          - "@univerjs/*"
    # vue-tsc 3.3.x uses TypeScript internals removed in TypeScript 7.
    # Lift this only with a verified compiler/vue-tsc upgrade.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    directory: /
    schedule:
      interval: daily
  # Renovate owns CI updates. The ignore rule also prevents separate
  # Dependabot security-update PRs; vulnerability alerts remain enabled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
