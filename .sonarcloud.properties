# SonarCloud Configuration
# https://sonarsource.github.io/sonarcloud/
sonar.organization=victron-venus
sonar.projectKey=victron-venus_inverter-dashboard-vue
sonar.sources=src,public
# Reviewed python:S8707 false positives in the frozen shared release helpers.
# prepare_version.py writes validated version text as content to fixed pr-body.md;
# release_versioned.py writes manifest content to a fixed private stage destination.
# Neither content value selects the output path. Automatic Analysis supports exact
# file exclusions here, so retain analysis of the other release helpers.
sonar.exclusions=src/i18n/**,src/static/**,**/*.test.ts,scripts/prepare_version.py,scripts/release_versioned.py
sonar.sourceEncoding=UTF-8
sonar.cpd.exclusions=src/i18n/**

# Ignore empty functions - intentional design pattern for HA lifecycle hooks
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/useHA.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S7721
sonar.issue.ignore.multicriteria.e2.resourceKey=**/useHA.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6582
sonar.issue.ignore.multicriteria.e3.resourceKey=**/useConnection.ts
